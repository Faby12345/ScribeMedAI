spring:
  application:
    name: scribemed-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(level=%5p) %clr(app=${spring.application.name}){cyan} %clr(requestId=%X{requestId:-none}){magenta} %clr(thread=%t){faint} %clr(logger=%logger{36}){blue} message=%replace(%m){'[\r\n]+',' '}%n%wEx"
level:
    root: INFO
    ro.scribemed.backend: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
