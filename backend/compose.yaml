services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: scribemed-backend:local
    container_name: scribemed-backend

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SCRIBEMED_AUDIO_LOCAL_STORAGE_DIR: /app/var/audio

      SCRIBEMED_SESSION_COOKIE_SECURE: ${SCRIBEMED_SESSION_COOKIE_SECURE:-false}
      SCRIBEMED_SESSION_COOKIE_SAME_SITE: ${SCRIBEMED_SESSION_COOKIE_SAME_SITE:-Lax}

      SCRIBEMED_DEV_SEED_ENABLED: ${SCRIBEMED_DEV_SEED_ENABLED:-false}
      SCRIBEMED_DEV_TENANT_NAME: ${SCRIBEMED_DEV_TENANT_NAME:-Demo Clinic}
      SCRIBEMED_DEV_DOCTOR_EMAIL: ${SCRIBEMED_DEV_DOCTOR_EMAIL:-}
      SCRIBEMED_DEV_DOCTOR_PASSWORD: ${SCRIBEMED_DEV_DOCTOR_PASSWORD:-}
      SCRIBEMED_DEV_DOCTOR_DISPLAY_NAME: ${SCRIBEMED_DEV_DOCTOR_DISPLAY_NAME:-Dr. Demo}

      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}

    ports:
      - "8080:8080"

    volumes:
      - scribemed-backend-audio:/app/var/audio

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg18
    container_name: scribemed-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - scribemed-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  scribemed-backend-audio:
  scribemed-postgres-data:
